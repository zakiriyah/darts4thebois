<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dart Counter</title>
<meta name="theme-color" content="#0e1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e1411;--card:#16201b;--line:#25332b;--tx:#efe6cf;--mut:#8fa196;--red:#e8483f;--grn:#34a873;--gold:#e9b949;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
body{min-height:100%;padding:12px 14px 28px;max-width:560px;margin:0 auto;user-select:none}
h1,h2,.big,.num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;margin:0;font-weight:700}
h1{font-size:64px;line-height:1;letter-spacing:.02em;margin:18px 0 4px}
h2{font-size:28px}
.sub{color:var(--mut);margin:0 0 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.ghost{background:none;color:var(--mut);padding:10px 6px;font-size:16px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile .num{font-size:46px;line-height:1}.tile small{color:var(--mut);font-size:13px;line-height:1.3}
.tile.red{border-color:var(--red)}.tile.grn{border-color:var(--grn)}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:17px;padding:12px}
.x{background:var(--card);border:1px solid var(--line);border-radius:10px;width:46px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:16px}
.chip.on{background:var(--tx);color:#1a1f1b;border-color:var(--tx)}
.lbl{color:var(--mut);font-size:14px;margin:16px 0 4px}
.pri{width:100%;background:var(--red);color:#fff;border-radius:12px;padding:16px;font-size:19px;font-weight:600;margin-top:10px}
.sec{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;margin-top:8px}
.dng{width:100%;background:#2a1816;border:1px solid var(--red);border-radius:12px;padding:14px;font-size:16px;margin-top:8px}
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.pc.on{border-color:var(--gold)}.pc.dead{opacity:.35}
.nm{color:var(--mut);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc.on .nm{color:var(--gold)}
.big{font-size:64px;line-height:1}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.hearts{font-size:22px;letter-spacing:3px;color:var(--red)}.hearts i{font-style:normal;opacity:.25}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}.badge.k{background:var(--red);color:#fff}
.disp{background:#0a0f0c;border:1px solid var(--line);border-radius:12px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:48px;font-weight:700;padding:2px;margin:6px 0}
.quick{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}.quick .chip{padding:7px 14px;flex:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 0;font-size:26px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.keys .ok{background:var(--grn);border-color:var(--grn);color:#fff;font-size:22px}
table{width:100%;border-collapse:separate;border-spacing:5px}
th{font-weight:500;font-size:14px;color:var(--mut);padding:2px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.on{color:var(--gold)}
td.n{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;text-align:center;width:44px}
td.c{background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;font-size:26px;height:50px;cursor:pointer}
td.c.full{color:var(--grn)}
.score td{text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar b{display:block;height:100%;background:var(--grn)}
.ov{position:fixed;inset:0;background:rgba(5,8,6,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:24px;width:100%;max-width:360px;text-align:center}
.modal h2{font-size:38px;margin-bottom:6px}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}#t.show{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.slot{background:#0a0f0c;border:1px dashed var(--line);border-radius:12px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;color:var(--mut);line-height:1}
.slot.f{border:1px solid var(--gold);color:var(--tx)}.slot small{font-size:13px;color:var(--mut);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 0;font-size:16px}
.seg .on{background:var(--tx);color:#1a1f1b;border-color:var(--tx)}.seg .d.on{background:var(--grn);color:#fff;border-color:var(--grn)}.seg .t.on{background:var(--red);color:#fff;border-color:var(--red)}
.nk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nk button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;height:48px;font-size:24px;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.nk .w2{grid-column:span 2}.nk .miss{color:var(--mut)}
.nk.m2 button:not(.miss){border-color:var(--grn)}.nk.m3 button:not(.miss){border-color:var(--red)}
.co{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.route{display:flex;gap:8px;margin-top:6px}.route span{flex:1;text-align:center;background:#0a0f0c;border:1px solid var(--line);border-radius:10px;padding:5px 0;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700}
.out{color:var(--gold);font-size:13px;margin-top:2px}
.lbx{margin-top:26px}.lbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lb{border-spacing:0}.lb th{max-width:none;padding:6px 4px;text-align:center;font-size:13px}
.lb td{padding:10px 4px;text-align:center;border-top:1px solid var(--line);font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700}
.lb td.rk{color:var(--mut);width:26px;font-size:18px}.lb td.pn{text-align:left;font-family:system-ui,sans-serif;font-size:16px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb td.s{color:var(--gold)}
</style></head>
<body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={screen:'home',game:null,names:['Player 1','Player 2'],start:501,dbl:true,g:null,inp:'',mode:'darts',mult:1,sort:'legs'},H=[];
const TITLES={x01:()=>S.start,killer:()=>'Killer',cricket:()=>'Cricket',clock:()=>'Around the clock'};
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
function snap(){H.push(JSON.stringify(S.g));if(H.length>300)H.shift()}
function undo(){if(H.length){S.g=JSON.parse(H.pop());render()}}
function go(s){S.screen=s;render()}
function pick(g,s){S.game=g;if(s)S.start=s;go('setup')}
function rm(i){if(S.names.length>1){S.names.splice(i,1);render()}}
function add(){if(S.names.length<8){S.names.push('Player '+(S.names.length+1));render()}}
function quit(){if(confirm('Leave this game?')){S.g=null;go('home')}}

function start(){
  const n=S.names=S.names.map((x,i)=>x.trim()||'Player '+(i+1)),k=n.length,z=v=>n.map(()=>v);
  if(S.game!='x01'&&S.game!='clock'&&k<2)return toast('Add at least 2 players');
  H=[];S.inp='';S.mult=1;
  if(S.game=='x01')S.g={cur:0,leg:0,win:null,sc:z(S.start),legs:z(0),darts:z(0),pts:z(0),last:z(null),td:[],miss:z(0),mr:z(0)};
  if(S.game=='killer'){const pool=[...Array(20)].map((_,i)=>i+1).sort(()=>Math.random()-.5);S.g={cur:0,win:null,num:pool.slice(0,k),lives:z(3),killer:z(false)}}
  if(S.game=='cricket')S.g={cur:0,win:null,marks:n.map(()=>[0,0,0,0,0,0,0]),pts:z(0)};
  if(S.game=='clock')S.g={cur:0,win:null,pos:z(1)};
  go('game')
}

/* ---------- X01 ---------- */
const DC={20:0,16:1,8:2,10:3,12:4,18:5,4:6,6:7,14:8,2:9};
const DARTS=(()=>{const a=[];for(let n=1;n<=20;n++){
  a.push({v:n,l:''+n,c:n==20?1.5:n==19?2.5:4+(20-n)*.1});
  a.push({v:n*2,l:'D'+n,d:1,c:7,f:DC[n]??10});
  a.push({v:n*3,l:'T'+n,c:n>=15?20-n:8+(14-n)*.1});}
  a.push({v:25,l:'25',c:5});a.push({v:50,l:'Bull',d:1,c:6,f:3});return a})();
const memo={};
function co(rem,k){
  if(k<1||rem<(S.dbl?2:1)||rem>(S.dbl?170:180))return null;
  const key=rem+'|'+k+'|'+S.dbl;if(key in memo)return memo[key];
  const fin=d=>!S.dbl||d.d,fc=d=>S.dbl?d.f:d.c;let best=null;
  for(let kk=1;kk<=k&&!best;kk++){let bc=1e9;
    if(kk==1)DARTS.forEach(d=>{if(d.v==rem&&fin(d)&&fc(d)<bc){bc=fc(d);best=[d.l]}});
    if(kk==2)DARTS.forEach(a=>DARTS.forEach(d=>{if(a.v+d.v==rem&&fin(d)){const c=a.c+fc(d);if(c<bc){bc=c;best=[a.l,d.l]}}}));
    if(kk==3)DARTS.forEach(a=>DARTS.forEach(b=>{if(b.v>a.v)return;const r=rem-a.v-b.v;if(r<1)return;DARTS.forEach(d=>{if(d.v==r&&fin(d)){const c=a.c+b.c+fc(d);if(c<bc){bc=c;best=[a.l,b.l,d.l]}}})}));
  }
  return memo[key]=best;
}
function setMode(m){if(S.g.td.length)return toast('Finish this turn first');S.mode=m;S.inp='';render()}
function setMult(m){S.mult=m;render()}
function endT(){S.g.cur=(S.g.cur+1)%S.g.sc.length;render()}
function thr(n){
  const g=S.g,i=g.cur;let m=S.mult;
  if(n==0)m=1;if(n==25&&m==3)return toast('No treble bull');
  const v=n*m,l=n==0?'Miss':n==25?(m==2?'Bull':'25'):(m==2?'D':m==3?'T':'')+n;
  snap();g.td.push({l,v,m});if(n==0)g.miss[i]++;S.mult=1;
  const sum=g.td.reduce((a,d)=>a+d.v,0),rem=g.sc[i]-sum;
  const bust=rem<0||(S.dbl&&(rem==1||(rem==0&&m!=2)));
  if(bust){g.darts[i]+=3;g.last[i]='Bust';g.td=[];toast('Bust! Score stays '+g.sc[i]);return endT()}
  if(rem==0){g.darts[i]+=g.td.length;g.pts[i]+=sum;g.last[i]=sum;g.legs[i]++;g.win=i;recLeg();g.td=[];return render()}
  if(g.td.length==3){g.sc[i]=rem;g.pts[i]+=sum;g.darts[i]+=3;g.last[i]=sum;g.td=[];endT()}else render()
}
function key(k){if(k=='<')S.inp=S.inp.slice(0,-1);else if(S.inp.length<3)S.inp+=k;render()}
function quick(v){S.inp=String(v);render()}
function sub(){
  const g=S.g,v=+S.inp||0;if(v>180)return toast('Max score is 180');
  snap();const i=g.cur,n=g.sc[i]-v;let bust=n<0||(S.dbl&&n==1);
  if(!bust&&n==0&&S.dbl&&!confirm('Finished on a double?'))bust=true;
  g.darts[i]+=3;
  if(bust){g.last[i]='Bust'}else{g.sc[i]=n;g.pts[i]+=v;g.last[i]=v;if(n==0){g.legs[i]++;g.win=i;recLeg();S.inp='';return render()}}
  g.cur=(i+1)%g.sc.length;S.inp='';render()
}
function nextLeg(){const g=S.g,n=g.sc.length;g.leg++;g.cur=g.leg%n;g.sc=g.sc.map(()=>S.start);g.last=g.last.map(()=>null);g.td=[];g.win=null;H=[];render()}
function x01(){
  const g=S.g,i=g.cur,sum=g.td.reduce((a,d)=>a+d.v,0),rem=g.sc[i]-sum,dm=S.mode=='darts',left=3-g.td.length;
  const cards=g.sc.map((s,p)=>{const o=p==i?null:co(s,3);return `<div class="pc ${p==i?'on':''}"><div class=nm>${esc(S.names[p])}</div><div class=big>${p==i?rem:s}</div><div class=meta>Avg ${g.darts[p]?(g.pts[p]/g.darts[p]*3).toFixed(1):'0.0'} · Last ${g.last[p]??'–'} · Legs ${g.legs[p]}</div>${o?`<div class=out>Out: ${o.join(' · ')}</div>`:''}</div>`}).join('');
  const r=co(rem,left);
  const chk=rem<=(S.dbl?170:180)?`<div class=co><b>${esc(S.names[i])} needs ${rem}</b>${r?`<div class=route>${r.map(x=>`<span>${x}</span>`).join('')}</div>`:`<div class=meta style="margin-top:4px">${left<3?`No finish with ${left} dart${left>1?'s':''} left`:'No finish this turn'}. Leave a double such as 32 or 40.</div>`}</div>`:'';
  const modes=`<div class=chips style="margin:8px 0 0"><button class="chip ${dm?'on':''}" onclick="setMode('darts')">Dart by dart</button><button class="chip ${dm?'':'on'}" onclick="setMode('total')">Total only</button></div>`;
  let inp;
  if(dm){
    const pre=S.mult==2?'D':S.mult==3?'T':'';
    inp=`<div class=slots>${[0,1,2].map(k=>{const d=g.td[k];return `<div class="slot ${d?'f':''}">${d?d.l:'–'}${d?`<small>${d.v}</small>`:''}</div>`}).join('')}</div>
    <div class=seg><button class="${S.mult==1?'on':''}" onclick="setMult(1)">Single</button><button class="d ${S.mult==2?'on':''}" onclick="setMult(2)">Double</button><button class="t ${S.mult==3?'on':''}" onclick="setMult(3)">Triple</button></div>
    <div class="nk m${S.mult}">${[...Array(20)].map((_,k)=>`<button onclick="thr(${k+1})">${pre}${k+1}</button>`).join('')}<button class=w2 onclick="thr(25)">${S.mult==2?'Bull':'25'}</button><button class="w2 miss" onclick="thr(0)">Miss</button><button class=miss onclick="undo()">⌫</button></div>`;
  }else inp=`<div class=lbl>${esc(S.names[i])}'s turn: total for 3 darts</div><div class=disp>${S.inp||'0'}</div>
    <div class=quick>${[26,41,45,60,81,100,140,180].map(v=>`<button class=chip onclick="quick(${v})">${v}</button>`).join('')}</div>
    <div class=keys>${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}<button onclick="key('<')">⌫</button><button onclick="key('0')">0</button><button class=ok onclick="sub()">Submit</button></div>`;
  return `<div class=pcs>${cards}</div>${chk}${inp}${modes}<p class=meta style="text-align:center">${S.dbl?'Double out':'Straight out'}${dm?' · pick Double or Triple first, then the number':''}</p>`
}

/* ---------- Killer ---------- */
const alive=g=>g.lives.map((l,i)=>l>0?i:-1).filter(i=>i>=0);
function kNext(){const g=S.g,n=g.lives.length;let i=g.cur;do{i=(i+1)%n}while(g.lives[i]<=0);g.cur=i;render()}
function kMake(){snap();S.g.killer[S.g.cur]=true;render()}
function kHit(t){const g=S.g;snap();g.lives[t]--;if(g.lives[t]<=0)g.killer[t]=false;const a=alive(g);if(a.length==1)g.win=a[0];render()}
function killer(){
  const g=S.g,c=g.cur,me=g.killer[c];
  return `<div class=pcs>${g.num.map((n,i)=>`<div class="pc ${i==c?'on':''} ${g.lives[i]<=0?'dead':''}"><div class=nm>${esc(S.names[i])}</div><div class=big>D${n}</div><div class=hearts>${[0,1,2].map(h=>h<g.lives[i]?'♥':'<i>♥</i>').join('')}</div><span class="badge ${g.killer[i]?'k':''}">${g.lives[i]<=0?'Out':g.killer[i]?'Killer':'Not yet a killer'}</span></div>`).join('')}</div>
  <div class=lbl>${esc(S.names[c])}'s turn</div>
  ${me?alive(g).map(j=>j==c?`<button class=sec onclick="kHit(${c})">Hit own double (lose a life)</button>`:`<button class=dng onclick="kHit(${j})">Hit ${esc(S.names[j])}'s double (D${g.num[j]})</button>`).join(''):`<button class=pri style="margin-top:0" onclick="kMake()">Hit own double: become a killer (D${g.num[c]})</button>`}
  <button class=sec onclick="kNext()">End turn</button>
  <p class=meta>Hit your own double to become a killer, then knock lives off the others. Last player standing wins.</p>`
}

/* ---------- Cricket ---------- */
const CR=['20','19','18','17','16','15','Bull'],SYM=['','／','✕','◎'];
function cTap(p,i){
  const g=S.g;snap();
  if(g.marks[p][i]<3)g.marks[p][i]++;
  else if(g.marks.some((r,q)=>q!=p&&r[i]<3))g.pts[p]+=i==6?25:20-i;
  const mx=Math.max(...g.pts);g.marks.forEach((r,q)=>{if(r.every(m=>m==3)&&g.pts[q]>=mx)g.win=q});render()
}
function cNext(){S.g.cur=(S.g.cur+1)%S.g.pts.length;render()}
function cricket(){
  const g=S.g;
  return `<table><tr><th></th>${S.names.map((n,i)=>`<th class="${i==g.cur?'on':''}">${esc(n)}</th>`).join('')}</tr>
  <tr class=score><td class=n style="font-size:15px;color:var(--mut)">Pts</td>${g.pts.map((p,i)=>`<td style="color:${i==g.cur?'var(--gold)':'var(--tx)'}">${p}</td>`).join('')}</tr>
  ${CR.map((r,i)=>`<tr><td class=n>${r}</td>${g.marks.map((m,p)=>`<td class="c ${m[i]==3?'full':''}" onclick="cTap(${p},${i})">${SYM[m[i][0]===undefined?m[i]:0]}</td>`).join('')}</tr>`).join('')}</table>
  <button class=sec onclick="cNext()">Next player (${esc(S.names[(g.cur+1)%g.pts.length])})</button>
  <p class=meta>Tap a cell for each mark. Close a number with 3 marks; extra hits score points while an opponent has it open. Close everything with the most points to win.</p>`
}

/* ---------- Around the clock ---------- */
const tg=p=>p>20?'Bull':p;
function aAdv(k){const g=S.g;snap();g.pos[g.cur]=Math.min(22,g.pos[g.cur]+k);if(g.pos[g.cur]>=22)g.win=g.cur;render()}
function aNext(){S.g.cur=(S.g.cur+1)%S.g.pos.length;render()}
function clock(){
  const g=S.g,p=g.pos[g.cur];
  return `<div class=pcs>${g.pos.map((x,i)=>`<div class="pc ${i==g.cur?'on':''}"><div class=nm>${esc(S.names[i])}</div><div class=big>${tg(x)}</div><div class=bar><b style="width:${(x-1)/21*100}%"></b></div></div>`).join('')}</div>
  <div class=lbl>${esc(S.names[g.cur])} is aiming for ${tg(p)}</div>
  <button class=pri style="margin-top:0" onclick="aAdv(1)">${p>20?'Hit the bull':'Single: move on 1'}</button>
  ${p>20?'':`<button class=sec onclick="aAdv(2)">Double: move on 2</button><button class=sec onclick="aAdv(3)">Triple: move on 3</button>`}
  <button class=sec onclick="aNext()">End turn</button>
  <p class=meta>Work from 1 to 20 then the bull. Doubles and triples skip ahead.</p>`
}

/* ---------- Leaderboard ---------- */
const LBK='darts-lb-v1';
function lbGet(){try{return JSON.parse(localStorage.getItem(LBK))||{}}catch(e){return {}}}
function lbSet(o){try{localStorage.setItem(LBK,JSON.stringify(o))}catch(e){}}
function recLeg(){
  const g=S.g,lb=lbGet();
  S.names.forEach((nm,p)=>{const k=nm.trim().toLowerCase(),r=lb[k]||(lb[k]={name:nm,legs:0,avg:0,miss:0});
    r.name=nm;if(p==g.win)r.legs++;r.miss+=g.miss[p]-g.mr[p];g.mr[p]=g.miss[p];
    if(g.darts[p]>=9)r.avg=Math.max(r.avg,g.pts[p]/g.darts[p]*3)});
  lbSet(lb)}
function lbSort(k){S.sort=k;render()}
function lbClear(){if(confirm('Clear the leaderboard on this device?')){try{localStorage.removeItem(LBK)}catch(e){}render()}}
function lbView(){
  const k=S.sort,rows=Object.values(lbGet()).sort((a,b)=>b[k]-a[k]||b.legs-a.legs||b.avg-a.avg).slice(0,10);
  if(!rows.length)return `<div class=lbx><h2>Leaderboard</h2><p class=meta>Finish a 501 or 301 leg and your stats show up here.</p></div>`;
  const c=x=>k==x?'s':'';
  return `<div class=lbx><div class=lbh><h2>Leaderboard</h2><button class=ghost onclick="lbClear()">Reset</button></div>
  <div class=chips style="margin:0 0 6px">${[['legs','Legs won'],['avg','Best average'],['miss','Most misses']].map(([x,t])=>`<button class="chip ${k==x?'on':''}" onclick="lbSort('${x}')">${t}</button>`).join('')}</div>
  <table class=lb><tr><th></th><th style="text-align:left">Player</th><th>Legs</th><th>Best avg</th><th>Misses</th></tr>
  ${rows.map((r,i)=>`<tr><td class=rk>${i+1}</td><td class=pn>${esc(r.name)}</td><td class="${c('legs')}">${r.legs}</td><td class="${c('avg')}">${r.avg?r.avg.toFixed(1):'–'}</td><td class="${c('miss')}">${r.miss}</td></tr>`).join('')}</table>
  <p class=meta>Counted from finished 501 and 301 legs on this device. Misses come from dart-by-dart entry. Best average needs at least 9 darts.</p></div>`
}

/* ---------- Screens ---------- */
function home(){
  return `<h1>Dart counter</h1><p class=sub>Pick a game to start scoring.</p>
  <div class=grid>
  <button class="tile red" onclick="pick('x01',501)"><span class=num>501</span><small>Classic race to zero</small></button>
  <button class="tile red" onclick="pick('x01',301)"><span class=num>301</span><small>Shorter race to zero</small></button>
  <button class="tile grn" onclick="pick('killer')"><span class=num>Killer</span><small>Become a killer, take lives</small></button>
  <button class="tile grn" onclick="pick('cricket')"><span class=num>Cricket</span><small>Close 20 to 15 and the bull</small></button>
  <button class=tile onclick="pick('clock')" style="grid-column:span 2"><span class=num>Around the clock</span><small>Hit 1 to 20, then the bull</small></button></div>${lbView()}`
}
function setup(){
  const x=S.game=='x01';
  return `<header><button class=ghost onclick="go('home')">‹ Back</button><h2>${TITLES[S.game]()}</h2><span style="width:60px"></span></header>
  <div class=lbl>Players</div>
  ${S.names.map((n,i)=>`<div class=row><input type=text value="${esc(n)}" maxlength=14 oninput="S.names[${i}]=this.value" aria-label="Player ${i+1} name"><button class=x onclick="rm(${i})" aria-label="Remove player">✕</button></div>`).join('')}
  ${S.names.length<8?`<button class=sec style="margin-top:0" onclick="add()">Add player</button>`:''}
  ${x?`<div class=lbl>Starting score</div><div class=chips>${[101,201,301,501,701].map(v=>`<button class="chip ${S.start==v?'on':''}" onclick="S.start=${v};render()">${v}</button>`).join('')}</div>
  <div class=lbl>Finish</div><div class=chips><button class="chip ${S.dbl?'on':''}" onclick="S.dbl=true;render()">Double out</button><button class="chip ${S.dbl?'':'on'}" onclick="S.dbl=false;render()">Straight out</button></div>`:''}
  <button class=pri onclick="start()">Start game</button>`
}
function game(){
  const g=S.g,x=S.game=='x01';
  const body={x01,killer,cricket,clock}[S.game]();
  const win=g.win!=null?`<div class=ov><div class=modal><h2>${esc(S.names[g.win])} wins!</h2><p class=sub>${x?`Legs: ${S.names.map((n,i)=>esc(n)+' '+g.legs[i]).join(', ')}`:'Nice darts.'}</p>${x?`<button class=pri style="margin-top:0" onclick="nextLeg()">Next leg</button>`:`<button class=pri style="margin-top:0" onclick="start()">Rematch</button>`}<button class=sec onclick="S.g=null;go('home')">Home</button></div></div>`:'';
  return `<header><button class=ghost onclick="quit()">‹ Exit</button><h2>${TITLES[S.game]()}</h2><button class=ghost onclick="undo()">↶ Undo</button></header>${body}${win}`
}
function render(){app.innerHTML={home,setup,game}[S.screen]()}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
